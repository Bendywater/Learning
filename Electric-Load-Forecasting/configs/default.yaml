data:
  csv_path: data/raw/load.csv
  timestamp_col: timestamp
  target_col: load
  freq: h
  lookback: 168
  horizon: 24
  train_ratio: 0.7
  val_ratio: 0.15
  batch_size: 64
  num_workers: 0
  normalize: true
  feature_cols: []

model:
  input_size: 6
  hidden_size: 128
  num_layers: 2
  dropout: 0.2

train:
  seed: 42
  epochs: 20
  lr: 0.001
  weight_decay: 0.00001
  device: cpu
  output_dir: outputs
